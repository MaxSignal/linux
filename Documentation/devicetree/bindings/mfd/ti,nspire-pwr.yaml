%YAML 1.2
---
$id: http://devicetree.org/schemas/mfd/ti,nspire-pwr.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: TI-Nspire power management block

maintainers:
  - Krzysztof Kozlowski <krzk@kernel.org>

description:
  Register block controlling the clock dividers, peripheral bus access and
  low-power mode of TI-Nspire calculators. It also reports the state of the
  ON key, which is not part of the keypad matrix.

properties:
  compatible:
    items:
      - const: ti,nspire-pwr
      - const: syscon
      - const: simple-mfd

  reg:
    maxItems: 1

  power-button:
    type: object
    description:
      The ON key. Its interrupt line is shared with the unmaskable
      clock-change-done event of this block.
    additionalProperties: false

    properties:
      compatible:
        const: ti,nspire-power-button

      interrupts:
        maxItems: 1

    required:
      - compatible
      - interrupts

required:
  - compatible
  - reg

additionalProperties: false

examples:
  - |
    pwr@900b0000 {
        compatible = "ti,nspire-pwr", "syscon", "simple-mfd";
        reg = <0x900b0000 0x1000>;

        power-button {
            compatible = "ti,nspire-power-button";
            interrupts = <15>;
        };
    };
