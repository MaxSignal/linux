%YAML 1.2
---
$id: http://devicetree.org/schemas/crypto/ti,nspire-crypto.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: TI-Nspire SHA-256 and triple DES engines

maintainers:
  - Krzysztof Kozlowski <krzk@kernel.org>

properties:
  compatible:
    enum:
      - ti,nspire-des
      - ti,nspire-sha256

  reg:
    maxItems: 1

required:
  - compatible
  - reg

additionalProperties: false

examples:
  - |
    crypto@cc000000 {
        compatible = "ti,nspire-sha256";
        reg = <0xcc000000 0x1000>;
    };
